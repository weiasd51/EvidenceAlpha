name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  restore_benchmark_update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore benchmark update
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .benchmark-update-manifest.tsv ]]; then
            echo "No benchmark update payload found."
            exit 0
          fi
          while IFS=$'\t' read -r staged target; do
            target="${target%$'\r'}"
            mkdir -p "$(dirname "$target")"
            mv -- "$staged" "$target"
          done < .benchmark-update-manifest.tsv
          rm -- .benchmark-update-manifest.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add reproducible benchmark and evaluation report"
          git push

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests
      - run: python -m pytest --cov=backend --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
