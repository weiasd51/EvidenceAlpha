name: Restore project structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ hashFiles('.bootstrap-manifest.tsv') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore files and remove bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r staged target; do
            target="${target%$'\r'}"
            mkdir -p "$(dirname "$target")"
            mv -- "$staged" "$target"
          done < .bootstrap-manifest.tsv
          rm -- .bootstrap-manifest.tsv
          rm -- .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore EvidenceAlpha project structure"
          git push
